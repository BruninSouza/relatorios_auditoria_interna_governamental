name: Deploy Jupyter Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ATUALIZADO: Instala as dependências a partir do requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ATUALIZADO: Constrói o livro a partir da pasta 'notebooks'
      - name: Build Jupyter Book
        run: |
          jupyter-book build notebooks/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ATUALIZADO: Faz o upload do artefato a partir do novo caminho de build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: notebooks/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4